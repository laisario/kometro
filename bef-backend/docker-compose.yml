services:
  db:
    container_name: 'db'
    image: mysql:8.0.32
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - 'db:/var/lib/mysql'
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']

  minio:
    container_name: 'minio'
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_local_secret}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  createbuckets:
    container_name: 'createbuckets'
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minio_local} ${MINIO_SECRET_KEY:-minio_local_secret} &&
      mc mb local/${MINIO_BUCKET_NAME:-kometro-local} --ignore-existing &&
      mc anonymous set public local/${MINIO_BUCKET_NAME:-kometro-local} &&
      exit 0
      "

  web:
    container_name: 'web'
    build: .
    entrypoint: [""]
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_NAME: ${MYSQL_NAME}
      DIGITAL_OCEAN_ACCESS_KEY_ID: ${DIGITAL_OCEAN_ACCESS_KEY_ID}
      DIGITAL_OCEAN_SECRET_ACCESS_KEY: ${DIGITAL_OCEAN_SECRET_ACCESS_KEY}
      SITE: ${SITE}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      GITHUB_REBUILD_LANDINGPAGE_TOKEN: ${GITHUB_REBUILD_LANDINGPAGE_TOKEN}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      USE_MINIO: ${USE_MINIO:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_local_secret}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-kometro-local}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "8000:8000"
      - "8953:8953"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: always
    volumes:
      - ./app:/kometro

  redis:
    container_name: 'redis'
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  celery_worker:
    container_name: 'celery_worker'
    build: .
    entrypoint: [""]
    command: celery -A rkp_platform worker --loglevel=info --concurrency=2
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_NAME: ${MYSQL_NAME}
      DIGITAL_OCEAN_ACCESS_KEY_ID: ${DIGITAL_OCEAN_ACCESS_KEY_ID}
      DIGITAL_OCEAN_SECRET_ACCESS_KEY: ${DIGITAL_OCEAN_SECRET_ACCESS_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      USE_MINIO: ${USE_MINIO:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_local_secret}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-kometro-local}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      - redis
      - web
      - db
    volumes:
      - ./app:/kometro

  celery_beat:
    container_name: 'celery_beat'
    build: .
    entrypoint: [""]
    command: celery -A rkp_platform beat -l info
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    depends_on:
      - redis
      - web
      - db
    volumes:
      - ./app:/kometro

volumes:
  db:
  minio_data:
