name: Deploy Landing via FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bef-landing-page/**'
      - '.github/workflows/deploy-landingpage.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bef-landing-page/package-lock.json

      - name: 📄 Making .env
        working-directory: bef-landing-page
        run: echo "${{ secrets.NEXT_PUBLIC_API_URL }}" > .env

      - name: Install dependencies
        working-directory: bef-landing-page
        run: npm ci

      - name: Build Next.js
        working-directory: bef-landing-page
        run: npm run export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Debug - List build output
        run: |
          echo "Current directory: $(pwd)"
          echo "Build output contents:"
          ls -la bef-landing-page/out/ || echo "out/ directory not found!"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./bef-landing-page/out/
          server-dir: /www/
          log-level: verbose
          dry-run: false
